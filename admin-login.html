<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - AuraCore Management Portal</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <header class="app-header">
    <div class="brand-logo">
      <img src="assets/logo.jpg" alt="AuraCore Logo" class="brand-logo-img">
      <div>
        <div class="brand-title">AuraCore</div>
        <div class="brand-subtitle">Super Admin Portal</div>
      </div>
    </div>
    <a href="index.html" class="btn btn-secondary btn-sm" style="text-decoration: none;">🏠 Main Menu</a>
  </header>

  <main class="main-container">
    <div class="card" style="max-width: 460px; margin: 3rem auto; border: 1px solid var(--border-glow); padding: 2.5rem;">
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <img src="assets/logo.jpg" alt="AuraCore Logo" style="max-width: 140px; border-radius: 8px; margin-bottom: 1rem; border: 1px solid rgba(255,215,0,0.4);">
        <div style="width: 60px; height: 60px; border-radius: 50%; background: rgba(0, 229, 255, 0.15); color: var(--accent-cyan); display: flex; align-items: center; justify-content: center; font-size: 1.8rem; margin: 0 auto 0.75rem;">👑</div>
        <h2 style="font-family: var(--font-heading); font-size: 1.5rem; color: #FFF;">Management / Admin Login</h2>
        <p style="font-size: 0.85rem; color: var(--text-muted);">Enter admin credentials for master control.</p>
      </div>

      <form id="form-standalone-admin-login">
        <div class="form-group">
          <label class="form-label">Admin Username</label>
          <input type="text" id="page-admin-user" class="form-control" required placeholder="Enter Admin Username" />
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="page-admin-pass" class="form-control" required placeholder="Enter Password" />
        </div>
        <div style="text-align: right; margin-bottom: 1rem;">
          <a href="#" id="link-admin-forgot" style="color: var(--accent-cyan); font-size: 0.85rem; text-decoration: none;">🔑 Forgot Password? Self-Service Reset</a>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">
          🔓 Login to Admin Dashboard
        </button>
      </form>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('form-standalone-admin-login').addEventListener('submit', (e) => {
        e.preventDefault();
        const res = store.loginAdmin(document.getElementById('page-admin-user').value, document.getElementById('page-admin-pass').value);
        if (res.success) {
          window.location.href = 'admin-dashboard.html';
        } else {
          alert(res.error);
        }
      });

      const forgotLink = document.getElementById('link-admin-forgot');
      if (forgotLink) {
        forgotLink.addEventListener('click', (e) => {
          e.preventDefault();
          openForgotPasswordModal('admin');
        });
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Portal & Attendance - AuraCore</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <header class="app-header">
    <div class="brand-logo">
      <img src="assets/logo.jpg" alt="AuraCore Logo" class="brand-logo-img">
      <div>
        <div class="brand-title">AuraCore</div>
        <div class="brand-subtitle">Student Attendance & Fee Renewal Portal</div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;">
      <button class="btn btn-emerald btn-sm" onclick="store.returnToAdmin(); window.location.href='admin-dashboard.html';" style="font-weight: 700;">
        ⬅️ Back to Admin Panel
      </button>
      <a href="index.html" class="btn btn-secondary btn-sm" style="text-decoration: none;">🏠 Portal Choice</a>
      <div id="student-header-info">
        <button class="btn btn-secondary btn-sm" onclick="store.logout(); window.location.href='student-login.html';">
          🚪 Logout
        </button>
      </div>
    </div>
  </header>

  <main class="main-container">
    <div id="student-view-container"></div>
  </main>

  <footer class="app-footer">
    <div style="display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto;">
      <div><strong>AuraCore Student Portal</strong> • Attendance Progress & Mutual Verification</div>
      <div>Helpline: <strong>87547 59353</strong> | Official UPI: <strong>8754759353@upi</strong></div>
    </div>
  </footer>

  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!store.data.currentUser || store.data.currentUser.role !== 'client') {
        window.location.href = 'student-login.html';
        return;
      }
      const container = document.getElementById('student-view-container');
      renderClientView(container);
      store.subscribe(() => renderClientView(container));
    });
  </script>
</body>
</html>

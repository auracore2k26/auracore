<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Roster & Reassignments - AuraCore Admin</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <header class="app-header">
    <div class="brand-logo">
      <img src="assets/logo.jpg" alt="AuraCore Logo" class="brand-logo-img">
      <div>
        <div class="brand-title">AuraCore</div>
        <div class="brand-subtitle">Student Roster & Billing</div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 1rem;">
      <a href="index.html" class="btn btn-secondary btn-sm" style="text-decoration: none;">🏠 Portal Choice</a>
      <div id="user-header-bar">
        <span class="badge badge-emerald" style="font-size: 0.85rem; padding: 0.4rem 0.85rem;">
          🛡️ Admin Console
        </span>
        <button class="btn btn-secondary btn-sm" onclick="store.logout(); window.location.href='admin-login.html';">
          🚪 Logout
        </button>
      </div>
    </div>
  </header>

  <main class="main-container">
    <div id="admin-clients-container"></div>
  </main>

  <footer class="app-footer">
    <div style="display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto;">
      <div><strong>AuraCore Admin Module</strong> • Student Roster & Reassignments</div>
      <div>Helpline: <strong>87547 59353</strong></div>
    </div>
  </footer>

  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!store.data.currentUser || store.data.currentUser.role !== 'admin') {
        window.location.href = 'admin-login.html';
        return;
      }
      const container = document.getElementById('admin-clients-container');
      renderAdminClientsView(container);
      store.subscribe(() => renderAdminClientsView(container));
    });
  </script>
</body>
</html>
